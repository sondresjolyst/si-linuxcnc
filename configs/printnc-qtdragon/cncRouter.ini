# PrintNC router, QtDragon front end.
# Machine settings are identical to printnc-axis; only the [DISPLAY] section
# and the postgui HAL wiring differ. cncRouter.hal is a symlink to
# ../common/cncRouter.hal and is shared by all three configs.
#
# QtDragon needs at least 1280x768. On a smaller screen use printnc-gmoccapy.

[EMC]
MACHINE = cncRouter
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = qtvcp qtdragon
PREFERENCE_FILE_PATH = qtdragon.pref
MDI_HISTORY_FILE = mdi_history.dat
MACHINE_LOG_PATH = machine_log.dat
LOG_FILE = qtdragon.log
EDITOR = gedit
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
ARCDIVISION = 64
GRIDS = 10mm 20mm 50mm 100mm 1in 2in 5in 10in
MAX_FEED_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
MAX_SPINDLE_OVERRIDE = 1.2
# 24000 is the max speed the VFD is started with in cncRouter.hal.
MAX_SPINDLE_0_SPEED = 24000
# Water cooled 2.2 kW spindle, never run below 6000.
MIN_SPINDLE_0_SPEED = 6000
MAX_SPINDLE_0_OVERRIDE = 1.2
MIN_SPINDLE_0_OVERRIDE = 0.5
DEFAULT_LINEAR_VELOCITY = 7.5
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 29.0
CYCLE_TIME = 0.100
PROGRAM_PREFIX = /home/cnc/linuxcnc/nc_files
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm .005mm

# Run time estimate, fed by the pins from ../common/progress.py.
# gladevcp runs eta-panel.hal itself once its own pins exist, so a panel that
# fails to start leaves the machine running instead of failing postgui HAL.
EMBED_TAB_NAME = Progress
EMBED_TAB_LOCATION = tabWidget_utilities
EMBED_TAB_COMMAND = gladevcp -x {XID} -c eta -H ../common/eta-panel.hal ../common/eta.ui

[PROBE]
USE_PROBE = none

[KINS]
JOINTS = 4
# KINEMATICS = trivkins coordinates=XYYZ kinstype=BOTH
KINEMATICS = trivkins coordinates=XYYZ

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
PROGRAM_EXTENSION = .nc,.tap G-Code File
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 150000
SERVO_PERIOD = 1000000

[HAL]
HALFILE = cncRouter.hal
HALFILE = custom.hal
POSTGUI_HALFILE = postgui_call_list.hal

[TRAJ]
COORDINATES =  X Y Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 29.0
# used to be 25.0 04.08.24

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.200
TOOL_TABLE = tool.tbl

#*** AXIS_X *******************************
#STEPGEN_MAXACCEL should be up to 10% more than MAX_ACCELERATION
#MAX_VELOCITY is mm/s, MAX_ACCELERATION is mm/s^2
[AXIS_X]
MAX_VELOCITY = 29.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -0.10
MAX_LIMIT = 600.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -0.1
MAX_LIMIT = 600.0
MAX_VELOCITY = 29.0
MAX_ACCELERATION = 100.0
STEPGEN_MAXACCEL = 120
SCALE = -100.573
FERROR = 1.270
MIN_FERROR = .254
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -4
HOME_LATCH_VEL = 2
HOME_FINAL_VEL = 2
HOME_SEQUENCE = 1
#******************************************

#*** AXIS_Y *******************************
[AXIS_Y]
MAX_VELOCITY = 29.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -0.1
MAX_LIMIT = 400.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -0.1
MAX_LIMIT = 400.0
MAX_VELOCITY = 29.0
MAX_ACCELERATION = 100.0
STEPGEN_MAXACCEL = 120
SCALE = 100
FERROR = 1.270
MIN_FERROR = .254
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -4
HOME_LATCH_VEL = 2
HOME_FINAL_VEL = 2
HOME_SEQUENCE = -2

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -0.1
MAX_LIMIT = 400.0
MAX_VELOCITY = 29.0
MAX_ACCELERATION = 100.0
STEPGEN_MAXACCEL = 120
SCALE = 100
FERROR = 1.270
MIN_FERROR = .254
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -4
HOME_LATCH_VEL = 2
HOME_FINAL_VEL = 2
HOME_SEQUENCE = -2
#******************************************

#*** AXIS_Z *******************************
[AXIS_Z]
MAX_VELOCITY = 29.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -160.0
MAX_LIMIT = 0.0

[JOINT_3]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -160.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 29.0
MAX_ACCELERATION = 100.0
STEPGEN_MAXACCEL = 120
SCALE = 100.421
FERROR = 1.270
MIN_FERROR = .254
HOME_OFFSET = 1.0
HOME_SEARCH_VEL = 4
HOME_LATCH_VEL = 2
HOME_FINAL_VEL = 2
HOME_SEQUENCE = 0
#******************************************
