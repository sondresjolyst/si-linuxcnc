# Generated by stepconf 1.1 at Wed Oct 18 19:03:20 2023
# If you make changes to this file, they will be
# overwritten when you run stepconf again
# max speed should be 715mm/minute or 12mm per second

[EMC]
MACHINE = cncRouter
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
EDITOR = gedit
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
ARCDIVISION = 64
GRIDS = 10mm 20mm 50mm 100mm 1in 2in 5in 10in
MAX_FEED_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
MAX_SPINDLE_OVERRIDE = 1.2
DEFAULT_LINEAR_VELOCITY = 7.5
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 29.0
CYCLE_TIME = 0.100
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
PROGRAM_PREFIX = /home/cnc/linuxcnc/nc_files
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm .005mm
PYVCP = setter.xml

[KINS]
JOINTS = 4
# KINEMATICS = trivkins coordinates=XYYZ kinstype=BOTH
KINEMATICS = trivkins coordinates=XYYZ

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
PROGRAM_EXTENSION = .nc,.tap G-Code File
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
SUBROUTINE_PATH = ../../nc_files/macros

# Fixed tool setter, read by the setter_* macros in nc_files/macros.
# X and Y are the home corner: the setter sits under the home position.
# SAFE_Z keeps 5 mm off the Z soft limit.
# A tool with 55 mm stickout triggers at machine Z -52.06, so the collet nut
# reaches the setter at -107. MAXPROBE stops at -93, which a 40 mm tool reaches
# with about 20 mm stickout.
[TOOLSENSOR]
X = 0.0
Y = 0.0
SAFE_Z = -5.0
MAXPROBE = 88.0
SEARCH_VEL = 200
PROBE_VEL = 20

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 150000
SERVO_PERIOD = 1000000

[HAL]
HALFILE = cncRouter.hal
HALFILE = custom.hal
POSTGUI_HALFILE = postgui_call_list.hal
HALUI = halui

# The pyvcp button in setter.xml fires mdi-command-00.
[HALUI]
MDI_COMMAND = O<setter_zero> call

[TRAJ]
COORDINATES =  X Y Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 29.0
# used to be 25.0 04.08.24

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.200
TOOL_TABLE = tool.tbl

#*** AXIS_X *******************************
#STEPGEN_MAXACCEL should be up to 10% more than MAX_ACCELERATION
#MAX_VELOCITY is mm/s, MAX_ACCELERATION is mm/s^2
[AXIS_X]
MAX_VELOCITY = 29.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -0.10
MAX_LIMIT = 600.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -0.1
